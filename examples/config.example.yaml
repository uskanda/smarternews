# Server configuration. Copy to ~/.config/smarternews/config.yaml and edit.
# Every key is optional: without this file the server listens on 127.0.0.1:8787 and runs every task
# with the `claude` command (judge and cluster on the "haiku" model, the rest on "sonnet").

# Address to listen on. Keep 127.0.0.1 unless other devices must reach the server; to serve a tailnet,
# use the Tailscale address of this machine. Never expose the port to the internet.
listen: 127.0.0.1:8787

# Model providers. Give each a name and refer to that name under `tasks`.
providers:
  fast:
    adapter: claude-cli        # runs the `claude` command once per call
    model: haiku
  smart:
    adapter: claude-cli
    model: sonnet
  # An OpenAI-compatible server (Ollama, LM Studio, OpenRouter, ...). It cannot run the search task.
  # local:
  #   adapter: openai-compatible
  #   baseUrl: http://127.0.0.1:11434/v1
  #   model: your-model-name
  #   apiKeyEnv: LOCAL_LLM_API_KEY     # name of an environment variable; the key never goes in this file
  #   structuredOutput: json_schema    # or "prompt" for servers without response_format support

# Which provider runs each task. A task that is not listed uses `default`; `summarize` and `translate` use `fast` when they are not listed.
tasks:
  default: smart
  judge: fast
  cluster: fast
  summarize: fast         # summaries of the subscribed feeds that have them switched on
  translate: fast         # translation of feed articles when the translation API cannot be used

# Translation of the subscribed feeds that have it switched on. Without `google`, the model translates.
translation:
  google:
    apiKeyEnv: GOOGLE_TRANSLATE_API_KEY   # name of the environment variable that holds the key; never the key itself
  monthlyChars: 450000    # characters sent to Google per month; beyond it the model translates
  maxCharsPerArticle: 20000   # of one article's content, this much is translated

limits:
  llmCallsPerRun: 40      # a run stops, and is recorded as stopped_by_limit, when it reaches this
  llmCallsPerDay: 300     # calls of runs, counted from midnight in the configured time zone
  summariesPerDay: 100    # summaries of feed articles, counted apart from the calls of runs
  judgeBatchSize: 30      # candidates judged per model call
  pagesPerRun: 20         # article pages fetched per run
  runRetries: 2           # retries of a scheduled run that failed, 0 to 3; 0 switches them off

llm:
  timeoutMs: 180000
  searchTimeoutMs: 300000

fetch:
  userAgent: null         # null = "smarternews/<version> (+https://github.com/uskanda/smarternews)"
  hostIntervalMs: 1000    # minimum time between two requests to the same host
  timeoutMs: 15000
  maxBytes: 2000000
  # The crawler sends no request to loopback, private, link-local or shared-space (100.64.0.0/10) addresses.
  # List the hosts on your own network that it may fetch, for example a feed you host yourself.
  allowPrivateHosts: []   # e.g. [feeds.home.example, 192.168.0.10]

# Images in the content of feed articles reach the screens through the server, which fetches each one and
# keeps it on disk for a while. The signing key and the kept images live in the data directory.
images:
  cacheDays: 7               # an image older than this is fetched again
  cacheMaxBytes: 1000000000  # beyond this total, the oldest images are deleted

newsSearch:
  engines: [google-news]  # or [bing-news], or [google-news, bing-news] to ask both
  maxResultsPerQuery: 10  # newest results taken per query from each engine
