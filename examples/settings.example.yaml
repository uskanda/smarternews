# Example settings file. Load it with:
#   node apps/server/src/main.ts import examples/settings.example.yaml
# Everything here is sample data: replace the reader, the categories, the topics and the feeds with your own.
#
# A category holds two different things:
#   topics         what the model writes articles about; each topic lists the sources it collects from
#   subscriptions  feeds to read as they are, like in any feed reader; no model is involved
version: 1
settings:
  readerInfo: |
    A software engineer who maintains web services written in Rust and TypeScript,
    deploys them with GitHub Actions, and lives in Portland, Oregon.
  outputLanguage: en
  timeZone: America/Los_Angeles
  search: { language: en, region: US }
  # How often subscribed feeds are fetched, in minutes (5 to 1440). A subscription can set its own.
  feedIntervalMinutes: 30
  # After "mark all as read", open the next list that has unread articles.
  advanceAfterMarkAll: true
categories:
  - slug: security
    name: Security
    kind: news
    schedule: ["06:00", "18:00"]
    minImportance: 3
    maxArticlesPerRun: 5
    windowHours: 24
    topics:
      - text: Vulnerabilities that are being exploited in the wild, and large security incidents
        sources:
          feeds: ["https://www.bleepingcomputer.com/feed/"]
          newsSearch: true
          llmSearch: false
  - slug: developer-tools
    name: Developer tools
    kind: news
    schedule: ["06:00"]
    topics:
      - text: New features and pricing changes in GitHub
        sources:
          feeds: ["https://github.blog/changelog/feed/"]
          newsSearch: false
          llmSearch: false
      - text: Rust releases and notable changes to the language or Cargo
        sources:
          feeds: ["https://blog.rust-lang.org/feed.xml"]
          newsSearch: true
          llmSearch: false
    subscriptions:
      - url: https://nodejs.org/en/feed/blog.xml
      - url: https://www.typescriptlang.org/feed.xml
        title: TypeScript blog
        intervalMinutes: 360
        autoSummarize: true   # a model summarises the articles this feed delivers from now on
        translate: true       # titles and contents are translated into outputLanguage; they leave this server for that
  - slug: local-events
    name: Local events
    kind: event
    schedule: ["07:00"]
    windowDays: 7
    topics:
      - text: Maker fairs, technology meetups and cycling events in Portland, Oregon
        sources:
          newsSearch: false
          llmSearch: true
# Subscribed feeds that belong to no category.
subscriptions:
  - url: https://www.rfc-editor.org/rfcrss.xml
# Feed articles whose title contains one of these words are hidden. With `scope: title_and_content`
# the content is searched too. Generated articles are never hidden.
stopWords:
  - text: sponsored
  - text: giveaway
    scope: title_and_content
