# Example settings file. Load it with:
#   node apps/server/src/main.ts import examples/settings.example.yaml
# Everything here is sample data: replace the reader, the categories, the topics and the feeds with your own.
#
# A category holds two different things:
#   topics         what the model writes articles about; each topic lists the sources it collects from
#   subscriptions  feeds to read as they are, like in any feed reader; no model is involved
version: 1
settings:
  readerInfo: |
    A software engineer who maintains web services written in Rust and TypeScript,
    deploys them with GitHub Actions, and lives in Portland, Oregon.
  outputLanguage: en
  timeZone: America/Los_Angeles
  search: { language: en, region: US }
  # How often subscribed feeds are fetched, in minutes (5 to 1440). A subscription can set its own.
  feedIntervalMinutes: 30
  # After "mark all as read", open the next list that has unread articles.
  advanceAfterMarkAll: true
  # Show an article that several feeds deliver once in the lists over everything and over categories.
  # The copies stay in the list of their own feed.
  removeDuplicates: true
  # The times of day a digest of what arrived is made. An empty list makes digests by hand only.
  digestSchedule: ["07:00", "19:00"]
categories:
  - slug: security
    name: Security
    kind: news
    schedule: ["06:00", "18:00"]
    minImportance: 3
    maxArticlesPerRun: 5
    windowHours: 24
    topics:
      - text: Vulnerabilities that are being exploited in the wild, and large security incidents
        sources:
          feeds: ["https://www.bleepingcomputer.com/feed/"]
          newsSearch: true
          llmSearch: false
  - slug: developer-tools
    name: Developer tools
    kind: news
    schedule: ["06:00"]
    topics:
      - text: New features and pricing changes in GitHub
        sources:
          feeds: ["https://github.blog/changelog/feed/"]
          newsSearch: false
          llmSearch: false
      - text: Rust releases and notable changes to the language or Cargo
        sources:
          feeds: ["https://blog.rust-lang.org/feed.xml"]
          newsSearch: true
          llmSearch: false
    subscriptions:
      - url: https://nodejs.org/en/feed/blog.xml
      - url: https://www.typescriptlang.org/feed.xml
        title: TypeScript blog
        intervalMinutes: 360
        autoSummarize: true    # a model summarises the articles this feed delivers from now on
        translate: true        # titles and contents are translated into outputLanguage; they leave this server for that
        fetchFullContent: true # the page of each new article is fetched and its text kept as the full content
        topicSource: true      # runs of this category judge its articles as candidates of every topic; a feed of a category only
        # The element of the article's page that holds its body, for full content and summaries. Left out,
        # Readability finds the body; so it does on a page where the selector matches nothing.
        contentSelector: "article .post-body"
  - slug: local-events
    name: Local events
    kind: event
    schedule: ["07:00"]
    windowDays: 7
    topics:
      - text: Maker fairs, technology meetups and cycling events in Portland, Oregon
        sources:
          newsSearch: false
          llmSearch: true
# Subscribed feeds that belong to no category.
subscriptions:
  - url: https://www.rfc-editor.org/rfcrss.xml
# Filters hide feed articles; generated articles and starred articles are never hidden. A hide filter hides
# what meets all its conditions. A keep filter, for a category (by slug) or a feed (by URL), hides what meets
# none of the keep filters there. A condition looks at one or more fields (title, content, author, url) and
# matches its value as a part of the text (`contains`) or as a regular expression (`regex`); case and
# full-width letters do not matter. `enabled: false` keeps a filter without applying it.
filters:
  - action: hide
    scope: all
    conditions:
      - fields: [title, content]
        match: contains
        value: sponsored
  - action: keep
    scope: { feed: "https://www.rfc-editor.org/rfcrss.xml" }
    enabled: false
    conditions:
      - fields: [title]
        match: regex
        value: "^RFC \\d+: (HTTP|TLS)"
# Rules act on a feed article once, when it is first stored and no filter hides it: they star it, mark it
# read, have the Android app notify it, or ask for its summary, even when its feed does not summarise. They
# take the conditions and scope of filters, and one or more of the actions star, read, notify and summarize.
rules:
  - scope: { feed: "https://www.rfc-editor.org/rfcrss.xml" }
    conditions:
      - fields: [title]
        match: contains
        value: HTTP
    actions: [star, notify]
# Term groups colour their terms wherever they occur in the lists and the texts of articles, generated and
# delivered alike; nothing is hidden. Each group has a name and one colour of four: green, purple, pink or
# orange. Terms match as filters do: as a part of the text, whatever the case and the width. Where terms of two
# groups match one place, the group listed first colours it. A group is matched by its name; terms are added,
# never removed.
termGroups:
  - name: Rust
    color: orange
    terms: [Rust, cargo]
  - name: Standards
    color: purple
    terms: [RFC]
# List views: how an entry of the left pane and the drawer orders its articles, newest or oldest first, and
# the format the web app shows it in: standard, compact (the title alone) or expanded (every article in full).
# Only the entries that differ from newest first and standard are listed. An entry is unread, all, starred,
# generated or uncategorized; a category by its slug, with `generatedOnly: true` for its generated articles; or
# a feed by its URL. Event categories are always ordered by start.
listViews:
  - list: { feed: "https://www.rfc-editor.org/rfcrss.xml" }
    sort: oldest
    format: expanded
# Saved searches: the words of a search under a name, listed in the left pane of the web app with how many
# unread articles they find. A search may be narrowed to a category by its slug or to a feed by its URL; the
# scope is left out for a search over every article. A search with the same name, words and scope is not
# saved twice.
savedSearches:
  - name: Rust security
    query: rust vulnerability
    scope: { category: security }
