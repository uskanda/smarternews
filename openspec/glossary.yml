# Project glossary. One entry per term the repository has decided to use.
#   term:       the spelling to use
#   definition: one sentence saying what it is, not what it does
#   aliases:    spellings to avoid; terms-check reports them
#   en:         the English spelling, when the term is written in Japanese
version: 1
terms:
  - term: "カテゴリ"
    definition: "トピックと購読フィードをまとめる単位で、RSSの出力と実行時刻の単位でもある。"
    aliases: ["カテゴリー"]
    en: "category"
  - term: "トピック"
    definition: "利用者が登録する、追いたい話題を表すキーワードまたは文章。"
    aliases: ["ウォッチ項目", "監視項目"]
    en: "topic"
  - term: "種別"
    definition: "カテゴリが扱う記事の性質で、ニュース、イベント、状況のいずれか。"
    aliases: ["カテゴリ種別"]
    en: "kind"
  - term: "取得元"
    definition: "候補を集めてくる手段で、フィード、ニュース検索、LLM検索のいずれか。"
    aliases: ["情報源"]
    en: "source"
  - term: "候補"
    definition: "取得元から得た、記事の材料になりうる1件のWebページの情報。"
    aliases: ["候補記事"]
    en: "candidate"
  - term: "記事"
    definition: "一覧と本文で読む1件の単位で、生成記事と配信記事の2種類がある。"
    aliases: ["ストーリー"]
    en: "article"
  - term: "生成記事"
    definition: "同じ話題の候補をまとめてLLMが要約した記事で、画面では「AI生成」と表示する。"
    aliases: ["AI記事", "要約記事"]
    en: "generated article"
  - term: "AI生成"
    definition: "画面の項目の名前で、生成記事だけを集めた一覧を指す。"
    aliases: []
    en: "AI-generated"
  - term: "配信記事"
    definition: "購読フィードが配信した1項目を、要約せずにそのまま保存した記事。"
    aliases: ["フィード記事", "RSS記事"]
    en: "feed article"
  - term: "購読フィード"
    definition: "利用者が登録し、配信記事を読むために定期的に取得するフィード。"
    aliases: ["サブスクリプション", "登録フィード"]
    en: "subscription"
  - term: "取得周期"
    definition: "購読フィードを取得し直す間隔で、全体の基本の値とフィードごとの値がある。"
    aliases: ["クロール間隔", "ポーリング間隔"]
    en: "fetch interval"
  - term: "ストップワード"
    definition: "タイトルまたは内容に含む配信記事を、一覧から隠すために登録する語。"
    aliases: ["NGワード", "ミュート語"]
    en: "stop word"
  - term: "フォルダー"
    definition: "OPMLの中でフィードをまとめる入れ物で、読み込みと書き出しではカテゴリに対応させる。"
    aliases: ["フォルダ"]
    en: "folder"
  - term: "出典"
    definition: "記事の根拠になった候補のURL、サイト名、公開日時。"
    aliases: ["参照元", "引用元"]
    en: "reference"
  - term: "重要度"
    definition: "記事に付ける1から5の整数で、5が最も重要。"
    aliases: ["優先度"]
    en: "importance"
  - term: "読み手情報"
    definition: "利用者の立場や関心を書いた文章で、関連判定と重要度付けの入力になる。"
    aliases: ["読者情報", "ペルソナ"]
    en: "reader profile"
  - term: "タスク"
    definition: "LLMに頼む仕事の種類で、入力と出力のJSONスキーマが決まっているもの。"
    aliases: ["LLMタスク"]
    en: "task"
  - term: "プロバイダー"
    definition: "タスクを実行するLLMの提供元で、設定で名前を付けて登録する。"
    aliases: ["プロバイダ", "LLMバックエンド"]
    en: "provider"
  - term: "アダプター"
    definition: "プロバイダーの呼び出し方を共通のインターフェースに合わせる実装。"
    aliases: ["アダプタ", "ドライバー"]
    en: "adapter"
  - term: "実行"
    definition: "1つのカテゴリについて、候補の取得から記事の保存までを1回通すこと。"
    aliases: ["クロール実行"]
    en: "run"
  - term: "設定ファイル"
    definition: "カテゴリ、トピック、読み手情報を書き出したYAMLファイル。"
    aliases: ["初期データファイル"]
    en: "settings file"
  - term: "最低重要度"
    definition: "カテゴリごとに決める、記事にする重要度の下限。"
    aliases: ["重要度のしきい値"]
    en: "minimum importance"
  - term: "件数上限"
    definition: "カテゴリごとに決める、1回の実行で新しく作る記事の数の上限。"
    aliases: ["記事数上限"]
    en: "article limit"
  - term: "対象期間"
    definition: "候補を採用する時間の範囲で、ニュースは公開日時、イベントは開催日で測る。"
    aliases: ["取得期間"]
    en: "window"
  - term: "一部失敗"
    definition: "実行の状態の1つで、記事の保存まで進んだが、途中の処理のいくつかが失敗したもの。"
    aliases: ["部分失敗"]
    en: "partial failure"
  - term: "ペイン"
    definition: "画面を縦に分けた区画の1つ。カテゴリ、記事の一覧、記事の本文の3つがある。"
    aliases: ["カラム"]
    en: "pane"
  - term: "実行履歴"
    definition: "実行ごとの契機、時刻、状態、件数、失敗を残した記録。"
    aliases: ["実行ログ"]
    en: "run history"
  # 一般語。terms-checkの一般語リストに無いので、この用語集で使う表記を決める。
  - term: "ニュース"
    definition: "最近公開または更新された出来事の報道や発表で、種別の1つでもある。"
    aliases: []
    en: "news"
  - term: "クロール"
    definition: "取得元を巡回して候補を集める処理。"
    aliases: ["クローリング"]
    en: "crawl"
  - term: "クローラー"
    definition: "クロールから記事の保存までを受け持つサーバー側の処理のまとまり。"
    aliases: ["クローラ"]
    en: "crawler"
  - term: "フィード"
    definition: "サイトが配信するRSSまたはAtomの文書。取得元の1つでもあり、購読フィードとして直接読むこともできる。"
    aliases: []
    en: "feed"
  - term: "サイト"
    definition: "同じホスト名で公開されているWebページのまとまり。"
    aliases: ["ウェブサイト"]
    en: "site"
  - term: "ページ"
    definition: "1つのURLで取得できるWebの文書。"
    aliases: ["ウェブページ"]
    en: "page"
  - term: "スター"
    definition: "利用者が記事に付ける印で、付いた記事は保存期間を過ぎても残る。"
    aliases: ["お気に入り", "ブックマーク"]
    en: "star"
  - term: "スケジュール"
    definition: "カテゴリごとに決めた、実行を始める時刻の一覧。"
    aliases: []
    en: "schedule"
  - term: "タイムゾーン"
    definition: "時刻の計算に使う地域の標準時で、IANAの名前で指定する。"
    aliases: []
    en: "time zone"
  - term: "プログラム"
    definition: "LLMを呼ばずに、決まった手順で動くコード。"
    aliases: []
    en: "program"
  - term: "スキーマ"
    definition: "データの形を定めた定義で、タスクの入出力とAPIの入出力の検証に使う。"
    aliases: []
    en: "schema"
  - term: "ヘッダー"
    definition: "HTTPの要求または応答に付く、名前と値の組。"
    aliases: ["ヘッダ"]
    en: "header"
  - term: "パラメーター"
    definition: "URLの「?」以降に付ける、名前と値の組。"
    aliases: ["パラメータ", "クエリ"]
    en: "parameter"
  - term: "ブラウザー"
    definition: "Webの画面を表示する利用者側のアプリ。"
    aliases: ["ブラウザ"]
    en: "browser"
  - term: "キーボード"
    definition: "キーを押して画面を操作する入力装置。"
    aliases: []
    en: "keyboard"
  - term: "ダイアログ"
    definition: "操作の確認や入力のために、画面の上に重ねて出す小さな画面。"
    aliases: ["モーダル"]
    en: "dialog"
  - term: "ボタン"
    definition: "押すと1つの操作が実行される画面上の部品。"
    aliases: []
    en: "button"
  - term: "スクロール"
    definition: "画面に入りきらない内容を上下に送って見ること。"
    aliases: []
    en: "scroll"
  - term: "ゴシック"
    definition: "線の太さがほぼ一定の和文書体。一覧と操作に使う。"
    aliases: ["ゴシック体"]
    en: "gothic"
  - term: "コントラスト"
    definition: "文字の色と背景の色の明るさの差。"
    aliases: []
    en: "contrast"
  - term: "フォーカス"
    definition: "キーボードの操作を受け取る部品がどれかを示す状態。"
    aliases: []
    en: "focus"
  - term: "オリジン"
    definition: "URLのうち、方式、ホスト名、ポートの3つの組。同じオリジンかどうかでブラウザーが通信を制限する。"
    aliases: []
    en: "origin"
  - term: "アドレス"
    definition: "ネットワークの上で機器を指す番号。IPv4とIPv6のものを指す。"
    aliases: ["IPアドレス"]
    en: "address"
  - term: "ループバック"
    definition: "機器が自分自身を指すアドレスの範囲。"
    aliases: []
    en: "loopback"
  - term: "プライベート"
    definition: "組織や家庭のネットワークの中だけで使うアドレスの範囲。外のネットワークからは届かない。"
    aliases: []
    en: "private"
  - term: "リンクローカル"
    definition: "同じ区間の機器どうしだけで使うアドレスの範囲。"
    aliases: []
    en: "link-local"
  - term: "共有アドレス空間"
    definition: "通信事業者や仮想の専用網が内側で使うアドレスの範囲（100.64.0.0/10）。"
    aliases: ["CGNAT"]
    en: "shared address space"
  - term: "エミュレーター"
    definition: "開発用のマシンの上で、Androidの端末の動きを再現するプログラム。"
    aliases: ["エミュレータ"]
    en: "emulator"
  - term: "カメラ"
    definition: "端末に付いている撮影の機能。アプリではQRコードの読み取りに使う。"
    aliases: []
    en: "camera"
  - term: "アイコン"
    definition: "端末のアプリの一覧に出る、アプリを表す絵。"
    aliases: []
    en: "icon"
  - term: "タブレット"
    definition: "画面の大きい携帯端末。"
    aliases: []
    en: "tablet"
  - term: "ライブラリー"
    definition: "ほかのプログラムから呼び出して使う、部品としてのプログラム。"
    aliases: ["ライブラリ"]
    en: "library"
  - term: "引き出し"
    definition: "アプリの画面の左から出てくる、項目の一覧。"
    aliases: ["ドロワー"]
    en: "drawer"
  - term: "通知"
    definition: "アプリを開いていないときに、端末が画面の上部や待ち受けの画面に出す知らせ。"
    aliases: []
    en: "notification"
  - term: "メモリー"
    definition: "プログラムが動く間に使う、機器の作業用の記憶の領域。"
    aliases: []
    en: "memory"
  - term: "データベース"
    definition: "設定、記事、候補、実行履歴を保存する、サーバーの中の1つのファイル。"
    aliases: ["DB"]
    en: "database"
